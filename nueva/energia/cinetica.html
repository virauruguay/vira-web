<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>VIRA · Energía: Cinética</title>
<link rel="icon" href="../marca/simbolo-azul.svg">
<style>
@font-face{font-family:Figtree;font-weight:400;font-display:swap;src:url(../fuentes/figtree-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:Figtree;font-weight:800;font-display:swap;src:url(../fuentes/figtree-latin-800-normal.woff2) format("woff2")}
:root{--azul:#2E43E0;--mandarina:#FF7A3D;--negro:#0B0B0F;--niebla:#EEF0FA}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Figtree,system-ui,sans-serif;background:var(--niebla);color:var(--negro);overflow-x:hidden}
::selection{background:var(--azul);color:#fff}
.escena{height:420vh;position:relative}
.pin{position:sticky;top:0;height:100vh;height:100svh;overflow:hidden;background:var(--fondo,var(--niebla));color:var(--tinta,var(--negro))}
.cab{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:26px 48px;z-index:5}
.cab img{height:30px}
.cab span{font-size:17px}
.palabra{position:absolute;left:50%;top:50%;font-weight:800;font-size:19vw;letter-spacing:-.06em;line-height:.8;white-space:nowrap;transform-origin:50% 50%;will-change:transform}
.resto{position:absolute;left:24vw;top:26vh;right:6vw;font-weight:800;font-size:9.6vw;line-height:.86;letter-spacing:-.05em;color:#fff;z-index:3}
.resto span{display:inline-block;opacity:0;will-change:transform}
.simbolo{position:absolute;right:-8vw;bottom:-18vh;width:60vw;opacity:.16;transform:scale(0);transform-origin:80% 80%;z-index:1;will-change:transform}
.final{position:absolute;left:24vw;bottom:8vh;z-index:4;display:flex;gap:36px;align-items:center;opacity:0;transform:translateY(30px)}
.final p{font-size:21px;color:#fff;max-width:30ch;line-height:1.4}
.wa{display:inline-flex;align-items:center;min-height:62px;padding:0 34px;background:var(--mandarina);color:var(--negro);font-weight:800;font-size:20px;text-decoration:none;border-radius:999px;transition:transform .2s cubic-bezier(.34,1.56,.64,1)}
.wa:hover{transform:scale(1.06)}
.wa:active{transform:scale(.95)}
.baja{position:absolute;left:50%;bottom:5vh;transform:translateX(-50%);font-weight:800;font-size:18px;animation:salta 1.1s cubic-bezier(.34,1.56,.64,1) infinite alternate}
@keyframes salta{to{transform:translate(-50%,-12px)}}
.despues{min-height:60vh;background:var(--negro);color:#fff;display:flex;align-items:center;padding:0 48px;font-size:28px}
@media (max-width:760px){
  .cab{padding:18px 20px}.cab img{height:24px}
  .palabra{font-size:24vw}
  .resto{left:30vw;top:24vh;right:16px;font-size:17vw}
  .final{left:30vw;right:16px;bottom:5vh;display:block}
  .final p{font-size:17px;margin-bottom:16px}
  .wa{min-height:56px;padding:0 22px;font-size:17px}
  .simbolo{width:130vw;right:-50vw}
}
@media (prefers-reduced-motion:reduce){.baja{animation:none}}
</style>
</head>
<body>
<section class="escena" aria-label="Portada">
  <div class="pin">
    <div class="cab"><img id="logo" src="../marca/lockup-negro.svg" alt="VIRA"><span>Nicolás y Román</span></div>
    <img class="simbolo" src="../marca/simbolo-blanco.svg" alt="">
    <h1 class="oculto" style="position:absolute;left:-9999px">Publicidad con otra vuelta.</h1>
    <div class="palabra" aria-hidden="true">Publicidad</div>
    <div class="resto" aria-hidden="true"></div>
    <div class="final"><p>Marca, anuncios y web para negocios chicos de Uruguay. Te contestamos nosotros dos.</p><a class="wa" href="#">Escribinos por WhatsApp</a></div>
    <div class="baja">Bajá</div>
  </div>
</section>
<section class="despues"><p>Acá sigue la página.</p></section>
<script>
(() => {
  const quieto = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const escena = document.querySelector('.escena'), pin = document.querySelector('.pin');
  const palabra = document.querySelector('.palabra'), resto = document.querySelector('.resto');
  const simbolo = document.querySelector('.simbolo'), final = document.querySelector('.final'), baja = document.querySelector('.baja'), logo = document.getElementById('logo');
  'con otra vuelta.'.split(' ').forEach((pal, k, arr) => {
    const w = document.createElement('b'); w.style.cssText = 'white-space:nowrap;display:inline-block;font-weight:inherit';
    pal.split('').forEach((c) => { const s = document.createElement('span'); s.textContent = c; w.appendChild(s); });
    resto.appendChild(w); if (k < arr.length - 1) resto.appendChild(document.createTextNode(' '));
  });
  const letras = [...resto.querySelectorAll('span')];
  const c = (x) => Math.min(1, Math.max(0, x));
  const tramo = (p, a, b) => c((p - a) / (b - a));
  const resorte = (t) => { const s = 1.70158 * 1.4; return 1 + (s + 1) * Math.pow(t - 1, 3) + s * Math.pow(t - 1, 2); };
  const suave = (t) => 1 - Math.pow(1 - t, 3);
  function pintar(p) {
    // 1) "Publicidad" se agranda un poco  2) dobla 90° y se va al costado  3) el fondo pasa a azul de golpe
    const g = suave(tramo(p, .12, .42));
    const movil = innerWidth <= 760;
    const destinoX = movil ? -innerWidth * 0.5 + innerWidth * 0.13 : -innerWidth * 0.5 + innerWidth * 0.11;
    const entra = Math.min(1, (innerHeight * 0.8) / palabra.offsetWidth);   // acostada tiene que entrar en el alto
    const esc = (1 + .08 * tramo(p, 0, .12)) * (1 - g) + entra * g;
    palabra.style.transform = `translate(calc(-50% + ${destinoX * g}px), calc(-50% + ${innerHeight * 0.04 * g}px)) rotate(${-90 * g}deg) scale(${esc})`;
    const azul = p > .4;
    pin.style.setProperty('--fondo', azul ? '#2E43E0' : '#EEF0FA');
    palabra.style.color = azul ? '#fff' : '#0B0B0F';
    logo.src = azul ? '../marca/lockup-blanco.svg' : '../marca/lockup-negro.svg';
    pin.querySelector('.cab span').style.color = azul ? '#fff' : '#0B0B0F';
    // 4) "con otra vuelta." cae letra por letra
    letras.forEach((l, i) => {
      const t = tramo(p, .44 + i * .016, .44 + i * .016 + .08);
      l.style.opacity = t > 0 ? 1 : 0;
      l.style.transform = `translateY(${(1 - resorte(t)) * -120}%) scale(${1 + (1 - resorte(t)) * 1.6})`;
    });
    // 5) el símbolo crece desde la esquina y aparece el botón
    simbolo.style.transform = `scale(${resorte(tramo(p, .7, .86))})`;
    const f = resorte(tramo(p, .82, .94));
    final.style.opacity = c(f * 1.4); final.style.transform = `translateY(${(1 - f) * 30}px)`;
    baja.style.opacity = 1 - tramo(p, 0, .08);
  }
  function mover() { const r = escena.getBoundingClientRect(); const p = c(-r.top / (r.height - innerHeight)); pintar(p); }
  if (quieto) { pintar(1); return; }
  mover(); addEventListener('scroll', () => requestAnimationFrame(mover), { passive: true }); addEventListener('resize', mover);
  window.__pintar = pintar;
})();
</script>
</body>
</html>
